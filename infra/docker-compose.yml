# Local stack: single-node Kafka (KRaft), PostgreSQL (payments + ledger DBs), Redis.
# Production differs: 3+ brokers, RF=3, min.insync.replicas=2 (see design doc section 6.2).
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1   # required for exactly_once_v2 on one broker
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"           # topics are created explicitly by kafka-init
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    command: ["postgres", "-c", "wal_level=logical"]      # lets you switch to Debezium CDC later
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U payments -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./init-ledger-db.sql:/docker-entrypoint-initdb.d/01-ledger.sql:ro

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------------------------
  # Application services. Started only with:  docker compose --profile apps up -d --build
  # Spring Boot maps env vars like SPRING_KAFKA_BOOTSTRAP_SERVERS onto application.yml properties.
  # ---------------------------------------------------------------------------------------------
  payment-api:
    profiles: ["apps"]
    build: { context: .., dockerfile: Dockerfile, args: { MODULE: payment-api } }
    container_name: payment-api
    ports:
      - "8080:8080"
    environment: &app-env
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATA_REDIS_HOST: redis
    depends_on: &app-deps
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  fraud-scoring:
    profiles: ["apps"]
    build: { context: .., dockerfile: Dockerfile, args: { MODULE: fraud-scoring } }
    container_name: fraud-scoring
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: *app-deps

  ledger-service:
    profiles: ["apps"]
    build: { context: .., dockerfile: Dockerfile, args: { MODULE: ledger-service } }
    container_name: ledger-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledger
    depends_on: *app-deps

  notification-service:
    profiles: ["apps"]
    build: { context: .., dockerfile: Dockerfile, args: { MODULE: notification-service } }
    container_name: notification-service
    environment: *app-env
    depends_on: *app-deps
